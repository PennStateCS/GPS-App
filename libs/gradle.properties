# geokit build (libs/). Gradle reads this file both when libs/ is built on its own and when the root
# build includes it with includeBuild("libs").

# One version for all geokit artifacts. Single source: the root build does not define it.
# No publishing set up yet.
GEOKIT_VERSION=0.1.0-SNAPSHOT

# Used when this build runs on its own (the root build's own settings apply when it is included).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.code.style=official
