[versions]
agp = "9.5.1"
kotlin = "2.4.21"  # documentation only; the real pin is buildscript classpath in build.gradle.kts
ksp = "2.3.14"
dokka = "2.3.0"
coreKtx = "1.19.1"
junit = "4.13.2"
geographiclib = "2.0"  # MIT; geodesics on WGS84 for :geokit-core
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
lifecycleLivedataKtx = "2.11.1"
lifecycleViewmodelKtx = "2.11.1"
navigationFragmentKtx = "2.10.2"
navigationUiKtx = "2.10.2"
arcore = "1.57.0"
room = "2.8.5"
playServicesLocation = "21.4.0"
playServicesMaps = "20.1.0"
hilt = "2.60.1"
swiperefreshlayout = "1.2.0"
filament = "1.81.0"
datastore = "1.3.0"
coroutines = "1.11.0"
jmdns = "3.6.5"
# PINNED - do not upgrade. Emlid Reach firmware (RS2+ fw 33) speaks socket.io v2 / engine.io v3 (EIO=3):
# its handshake is the v3 binary polling payload even when EIO=4 is requested. Client 1.x speaks EIO=3;
# client 2.x speaks EIO=4 only and fails every handshake with "server error" (corrections/status lost).
# Plain HTTP on the receiver's LAN only. Re-check with the Reach before any bump.
socketIo = "1.0.1"
# Android's org.json API as a plain jar, for JVM compile/tests of :geokit-receiver-emlid only (compileOnly — the APK
# uses the platform copy).
androidJson = "0.0.20131108.vaadin1"
# org.json reference implementation, the version socket.io-client 1.0.1 / engine.io-client 1.0.1 declare in their POMs.
# runtimeOnly in :geokit-receiver-emlid so desktop JVM consumers get org.json; the app excludes it (platform copy).
orgJson = "20240303"   # public domain since 20231013 (older releases: JSON License, GPL-incompatible)
desugarJdkLibs = "2.1.5"
robolectric = "4.18"
androidxTestCore = "1.7.0"
mockito = "5.24.0"
fragmentTesting = "1.9.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
geographiclib = { group = "net.sf.geographiclib", name = "GeographicLib-Java", version.ref = "geographiclib" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleViewmodelKtx" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }
arcore = { group = "com.google.ar", name = "core", version.ref = "arcore" }
androidx-room-runtime   = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx       = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler  = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
hilt-android   = { group = "com.google.dagger", name = "hilt-android",  version.ref = "hilt" }
hilt-compiler  = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
filament-android = { group = "com.google.android.filament", name = "filament-android", version.ref = "filament" }
filament-utils-android = { group = "com.google.android.filament", name = "filament-utils-android", version.ref = "filament" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
socket-io-client = { group = "io.socket", name = "socket.io-client", version.ref = "socketIo" }
android-json = { group = "com.vaadin.external.google", name = "android-json", version.ref = "androidJson" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
androidx-fragment-testing = { group = "androidx.fragment", name = "fragment-testing", version.ref = "fragmentTesting" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application",           version.ref = "agp" }
hilt-android        = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
dokka               = { id = "org.jetbrains.dokka",               version.ref = "dokka" }

