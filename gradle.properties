# Project-wide Gradle settings

# Gradle JVM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djna.nosys=true

# AndroidX / Kotlin
android.useAndroidX=true
kotlin.code.style=official

# Leaner R classes
android.nonTransitiveRClass=true

# 16KB page-size / performance toggles
android.experimental.enableArtProfiles=true
android.experimental.r8.dex-startup-optimization=true
android.experimental.enableScreenshotTest=false
android.enableR8.fullMode=true
org.gradle.configuration-cache=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# AGP built-in Kotlin / new DSL are used (default in AGP 9+).

# Suppress the "excludeLibraryComponentsFromConstraints should be enabled" sync hint (the enable
# flag is itself deprecated, so we suppress rather than set it).
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# --- Optional build speedups ---
# org.gradle.parallel=true
# org.gradle.caching=true
# Enable only for local experiments; default is disabled above for build stability.
# org.gradle.configuration-cache=true