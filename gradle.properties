# Project-wide Gradle settings

# Gradle JVM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djna.nosys=true

# AndroidX / Kotlin
android.useAndroidX=true
kotlin.code.style=official

# Leaner R classes
android.nonTransitiveRClass=true

# 16KB page-size / performance toggles
android.experimental.enableArtProfiles=true
android.experimental.r8.dex-startup-optimization=true
android.experimental.enableScreenshotTest=false
android.enableR8.fullMode=true
org.gradle.configuration-cache=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# These two are load-bearing: the app applies the EXTERNAL Kotlin Gradle plugin (kotlin.android),
# which requires AGP's legacy DSL + variant API. Removing either makes the Kotlin plugin fail to
# apply ("ApplicationExtensionImpl cannot be cast to BaseExtension"). They are deprecated in AGP 9
# and removed in AGP 10 — the only way to drop them is to migrate to AGP's built-in Kotlin (remove
# the kotlin.android plugin). The "applicationVariants/testVariants is obsolete" warnings are a
# side effect of this legacy path and cannot be silenced without that migration.
android.builtInKotlin=false
android.newDsl=false

# Suppress the "excludeLibraryComponentsFromConstraints should be enabled" sync hint (the enable
# flag is itself deprecated, so we suppress rather than set it).
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# --- Optional build speedups ---
# org.gradle.parallel=true
# org.gradle.caching=true
# org.gradle.configuration-cache=true
